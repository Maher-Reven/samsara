[package]
name = "samsara-core"
description = "Deterministic replay, divergence detection and fault injection for LLM agent runs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Exposes the deterministic fake world and the agent under test, so other
# crates in the workspace (and downstream users writing their own agents)
# can build against the same harness the property tests use.
testkit = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
thiserror.workspace = true
rand.workspace = true
rand_chacha.workspace = true

[dev-dependencies]
proptest = "1"
