[package]
name = "samsara-cli"
description = "Command-line interface for Samsara: deterministic replay and fault injection for LLM agents."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Higher than the workspace: `ureq` reaches `idna` reaches `icu`, which
# requires 1.88. The engine deliberately does not depend on any of that, so a
# project embedding `samsara-core` is not dragged along.
rust-version = "1.88"
keywords = ["llm", "agents", "testing", "replay", "cli"]
categories = ["development-tools::testing", "command-line-utilities"]

[[bin]]
name = "samsara"
path = "src/main.rs"

[dependencies]
samsara-core = { path = "../samsara-core", features = ["testkit"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
# The end-to-end tests stand up a stub provider and drive the real binary.
tiny_http = "0.12"
