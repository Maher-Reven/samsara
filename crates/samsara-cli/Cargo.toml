[package]
name = "samsara-cli"
description = "Command-line interface for Samsara: deterministic replay and fault injection for LLM agents."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "samsara"
path = "src/main.rs"

[dependencies]
samsara-core = { path = "../samsara-core", features = ["testkit"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
