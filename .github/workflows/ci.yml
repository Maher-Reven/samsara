name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --features testkit -- -D warnings

      # The whole suite runs without a network or an API key. That is a
      # design constraint, not a happy accident: a test suite that needs
      # credentials is a test suite that stops being run.
      #
      # This includes the end-to-end attach tests, which drive the real
      # binary against a stub provider over real HTTP.
      - name: Test
        run: cargo test --features testkit

      # The worked example is executable documentation. If the README's
      # output stops being true, the build should notice.
      - name: Demo
        run: |
          cargo run --bin samsara -- demo
          cargo run --bin samsara -- demo --scenario order

      # `verify` exits non-zero on a violation, which is how it is meant to
      # be used in a real pipeline. Here we assert it does exactly that.
      - name: Verify detects the known-bad trace
        run: |
          cargo run --bin samsara -- emit
          cargo run --bin samsara -- verify traces/clean.samsara.jsonl \
            --effectful delete_file
          if cargo run --bin samsara -- verify traces/counterfactual.samsara.jsonl \
               --effectful delete_file; then
            echo "::error::verify passed a trace containing a duplicate side effect"
            exit 1
          fi

  # A declared MSRV nobody builds is a guess. This reads the version out of
  # Cargo.toml and compiles on exactly that toolchain, so the claim cannot
  # drift -- it was wrong by seven releases until this job existed.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: |
          lib=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cli=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' crates/samsara-cli/Cargo.toml | head -1)
          echo "lib=$lib" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          echo "engine MSRV $lib, cli MSRV $cli"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.lib }}
      - uses: Swatinem/rust-cache@v2
      # The engine is the part anyone would depend on, so its floor is the
      # one that matters.
      - run: cargo +${{ steps.msrv.outputs.lib }} check -p samsara-core --all-targets --features testkit
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.cli }}
      - run: cargo +${{ steps.msrv.outputs.cli }} check --all-targets --features testkit

  wasm:
    runs-on: ubuntu-latest
    env:
      WASM_BINDGEN_VERSION: "0.2.128"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2

      - name: Build the browser engine
        run: cargo build -p samsara-wasm --target wasm32-unknown-unknown --release

      - name: Install wasm-bindgen-cli
        run: |
          url="https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL "$url" | tar xzf - --strip-components=1 -C /usr/local/bin \
            "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen"

      # The page and the engine are written in different languages with
      # nothing checking that they agree on field names. Rename a field in
      # Rust and the wasm still loads perfectly -- the page just renders
      # undefined in every row. This catches that in CI rather than in front
      # of a visitor.
      - name: Page/engine contract
        run: |
          wasm-bindgen --target nodejs --no-typescript --out-dir web/pkg-node \
            target/wasm32-unknown-unknown/release/samsara_wasm.wasm
          node --test web/test/

  shim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shim/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit -p tsconfig.json
      # Covers the replay branch, which the recording proxy cannot yet
      # exercise end to end — see "What it does not do yet".
      - run: npm test
